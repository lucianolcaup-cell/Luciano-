name: Build SNES Flow APK

on:
  push:
    branches:
      - snes-flow-android-v0.1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Baixar core Snes9x oficial
        shell: bash
        run: |
          set -euo pipefail
          for ABI in arm64-v8a armeabi-v7a; do
            mkdir -p "app/src/main/jniLibs/${ABI}"
            URL="https://buildbot.libretro.com/nightly/android/latest/${ABI}/snes9x_libretro_android.so.zip"
            curl --fail --location --retry 3 --output "/tmp/snes9x-${ABI}.zip" "$URL"
            unzip -p "/tmp/snes9x-${ABI}.zip" > "app/src/main/jniLibs/${ABI}/snes9x_libretro_android.so"
            test -s "app/src/main/jniLibs/${ABI}/snes9x_libretro_android.so"
          done

      - name: Compilar APK debug
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee APK_SHA256.txt

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: SNES-Flow-v0.1.0-Android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30
