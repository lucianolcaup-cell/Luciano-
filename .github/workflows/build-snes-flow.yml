name: Build DonkeyK2 APK

on:
  push:
    branches:
      - snes-flow-android-v0.2.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK 35 + NDK + CMake
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Preparar ferramentas oficiais de assinatura
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/android-signing-tools
          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" /tmp/android-signing-tools/
          cp "$ZIPALIGN" /tmp/android-signing-tools/
          chmod +x /tmp/android-signing-tools/zipalign
          LIBCPP="$(ldd "$ZIPALIGN" | awk '/libc\+\+\.so/ && $3 ~ /^\// {print $3; exit}')"
          test -n "$LIBCPP"
          cp -L "$LIBCPP" /tmp/android-signing-tools/libc++.so

      - name: Publicar ferramentas de assinatura
        uses: actions/upload-artifact@v4
        with:
          name: Android-Signing-Tools-35
          path: /tmp/android-signing-tools/
          if-no-files-found: error
          retention-days: 1

      - name: Preparar LibretroDroid custom ScaleMaster
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          git clone --recurse-submodules https://github.com/Swordfish90/LibretroDroid.git vendor/LibretroDroid
          cd vendor/LibretroDroid
          git checkout 8835c3098514390a271e36983957f7bb5f40abf1
          git submodule update --init --recursive
          cd ../..
          python3 tools/patch_libretrodroid_master.py
          grep -q "donkeyMasterFragment" vendor/LibretroDroid/libretrodroid/src/main/cpp/shadermanager.cpp

      - name: Baixar patch PT-BR FURT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dkc2-patch
          URL="https://cdn.romhackers.org/traducoes/%5BSNES%5D%20Donkey%20Kong%20Country%202%20-%20Diddy%27s%20Kong%20Quest%20%28U%29%20%28V1.1%29%20%5B%21%5D%20%5BT-BR%5D%20%5BT-Solid%20One%2C%20denim%20e%20grande%20elenco%20G-FURT%5D%20%5BV-1.0%20P-100%25%20A-2017%5D.zip"
          curl --fail --location --retry 3 --output /tmp/dkc2-patch/furt.zip "$URL"
          unzip -j /tmp/dkc2-patch/furt.zip '*.ips' -d /tmp/dkc2-patch/extracted
          IPS="$(find /tmp/dkc2-patch/extracted -maxdepth 1 -type f -iname '*.ips' | head -n 1)"
          test -s "$IPS"
          cp "$IPS" /tmp/dkc2-patch/DKC2_FURT_PTBR_v1.0.ips
          sha256sum /tmp/dkc2-patch/DKC2_FURT_PTBR_v1.0.ips | tee /tmp/dkc2-patch/PATCH_SHA256.txt

      - name: Publicar patch PT-BR
        uses: actions/upload-artifact@v4
        with:
          name: DKC2-FURT-PTBR-Patch
          path: |
            /tmp/dkc2-patch/DKC2_FURT_PTBR_v1.0.ips
            /tmp/dkc2-patch/PATCH_SHA256.txt
          if-no-files-found: error
          retention-days: 1

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Baixar core Snes9x oficial
        shell: bash
        run: |
          set -euo pipefail
          for ABI in arm64-v8a armeabi-v7a; do
            mkdir -p "app/src/main/jniLibs/${ABI}"
            URL="https://buildbot.libretro.com/nightly/android/latest/${ABI}/snes9x_libretro_android.so.zip"
            curl --fail --location --retry 3 --output "/tmp/snes9x-${ABI}.zip" "$URL"
            unzip -p "/tmp/snes9x-${ABI}.zip" > "app/src/main/jniLibs/${ABI}/snes9x_libretro_android.so"
            test -s "app/src/main/jniLibs/${ABI}/snes9x_libretro_android.so"
          done

      - name: Validar ferramentas do projeto
        shell: bash
        run: |
          python3 -m py_compile tools/patch_furt_intro.py
          python3 -m py_compile tools/patch_libretrodroid_master.py

      - name: Compilar APK debug
        shell: bash
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verificar APK
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -q 'lib/arm64-v8a/libretrodroid.so'
          sha256sum app/build/outputs/apk/debug/app-debug.apk | tee APK_SHA256.txt

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: DonkeyK2-v0.2.1-ScaleMaster-Android
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            APK_SHA256.txt
          if-no-files-found: error
          retention-days: 30
