name: Build VórticeTv v0.1.12 FINAL

on:
  push:
    branches: [ vortise-tv-v0.1.12-release ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout VórticeTv customization
        uses: actions/checkout@v4
        with:
          path: branding-repo

      - name: Checkout tested PipeTV upstream
        uses: actions/checkout@v4
        with:
          repository: LimitedIO/PipeTv
          ref: ebf482b60bf44aa2f639dffb6c4a22f93da6cf1a
          path: src

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare VórticeTv v0.1.12 FINAL
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          bash branding-repo/scripts/prepare-v0112.sh src branding-repo

      - name: Production regression and security checks
        shell: bash
        run: |
          set -euo pipefail
          test -f branding-repo/VORTICETV_REGRAS_IMUTAVEIS.md
          grep -F 'class MusicAlbumPage' src/app/src/main/kotlin/dev/limitedio/pipetv/ui/MusicAlbumPage.kt
          grep -F 'musicQueue' src/app/src/main/kotlin/dev/limitedio/pipetv/media/Session.kt
          grep -F 'DefaultLoadControl.Builder()' src/app/src/main/kotlin/dev/limitedio/pipetv/media/Engine.kt
          ! grep -F 'class VorticeLoadControl' src/app/src/main/kotlin/dev/limitedio/pipetv/media/Engine.kt
          grep -F 'tag == "pt-br"' src/app/src/main/kotlin/dev/limitedio/pipetv/media/Audio.kt
          grep -F 'tag.startsWith("pt")' src/app/src/main/kotlin/dev/limitedio/pipetv/media/Audio.kt
          grep -F 'preferredQuery' src/app/src/main/kotlin/dev/limitedio/pipetv/ui/search/SearchData.kt
          grep -F '"$q português"' src/app/src/main/kotlin/dev/limitedio/pipetv/ui/search/SearchData.kt
          grep -F 'switchingMediaMode' src/app/src/main/kotlin/dev/limitedio/pipetv/media/Session.kt
          grep -F 'Engine.exo.stop()' src/app/src/main/kotlin/dev/limitedio/pipetv/media/Session.kt
          grep -F 'manualHeight != null' src/app/src/main/kotlin/dev/limitedio/pipetv/media/Recovery.kt
          grep -F '2160p · 4K' src/app/src/main/kotlin/dev/limitedio/pipetv/ui/PlayerMenu.kt
          grep -F 'Em reprodução:' src/app/src/main/kotlin/dev/limitedio/pipetv/ui/PlayerMenu.kt
          grep -F 'CNN Brasil ao vivo' src/app/src/main/kotlin/dev/limitedio/pipetv/ui/OpenChannelsPage.kt
          grep -F 'sourceCache' src/app/src/main/kotlin/dev/limitedio/pipetv/ui/OpenChannelsPage.kt
          grep -F 'Feed.popularBrazil()' src/app/src/main/kotlin/dev/limitedio/pipetv/ui/PopularPage.kt
          grep -F 'MOVIE_LIMIT = 600' src/app/src/main/kotlin/dev/limitedio/pipetv/ui/PopularPage.kt
          grep -F 'bufferedSafe' src/app/src/main/kotlin/dev/limitedio/pipetv/media/SponsorBlock.kt
          grep -F 'if (!musicMode && !longForm) SponsorBlock.load' src/app/src/main/kotlin/dev/limitedio/pipetv/media/Session.kt
          if grep -RniE 'globoplay|com\.globo|globo.?play|Globo ao vivo' src/app/src/main 2>/dev/null; then exit 1; fi
          if grep -RniE 'AIza[0-9A-Za-z_-]{20,}|BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY' src/app/src/main 2>/dev/null; then exit 1; fi
          if grep -RniE 'api[_-]?key[[:space:]]*=' src/app/src/main 2>/dev/null; then exit 1; fi

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"

      - name: Unit tests
        shell: bash
        run: |
          set -euo pipefail
          cd src
          ./gradlew testDebugUnitTest -Pnoupdater -Pvname=0.1.12 -Pvcode=13 --stacktrace

      - name: Android lint
        shell: bash
        run: |
          set -uo pipefail
          cd src
          set +e
          ./gradlew lintRelease -Pnoupdater -Pvname=0.1.12 -Pvcode=13 --stacktrace
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo '===== FULL ANDROID LINT REPORT ====='
            report='app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt'
            if [ -f "$report" ]; then cat "$report"; fi
            exit "$rc"
          fi

      - name: Build signed release APK
        shell: bash
        run: |
          set -euo pipefail
          cd src
          ./gradlew assembleRelease -Pnoupdater -Pvname=0.1.12 -Pvcode=13 --stacktrace
          mkdir -p ../out
          cp app/build/outputs/apk/release/app-release.apk ../out/VorticeTv-v0.1.12-FINAL.apk
          sha256sum ../out/VorticeTv-v0.1.12-FINAL.apk | tee ../out/SHA256.txt
          test "$(stat -c%s ../out/VorticeTv-v0.1.12-FINAL.apk)" -lt 25000000

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs out/VorticeTv-v0.1.12-FINAL.apk | tee out/signature.txt

      - name: Enable KVM for runtime smoke test
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true

      - name: Android runtime smoke test
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: sed 's#VorticeTv-v0.1.11-TESTE.apk#VorticeTv-v0.1.12-FINAL.apk#g' branding-repo/scripts/runtime-smoke-v0111.sh > /tmp/runtime-smoke-v0112.sh && sh /tmp/runtime-smoke-v0112.sh

      - name: Final artifact gate
        shell: bash
        run: |
          set -euo pipefail
          test -s out/VorticeTv-v0.1.12-FINAL.apk
          test -s out/SHA256.txt
          test -s out/signature.txt
          test -s out/runtime-smoke-log.txt
          ! grep -A 30 'FATAL EXCEPTION' out/runtime-smoke-log.txt | grep -q 'br.com.luciano.noutubetv'
          echo 'VORTICETV_RELEASE_GATE_OK'

      - name: Upload approved APK and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VorticeTv-v0.1.12-FINAL
          path: |
            out/VorticeTv-v0.1.12-FINAL.apk
            out/SHA256.txt
            out/signature.txt
            out/runtime-smoke-log.txt
          if-no-files-found: warn
          retention-days: 90
