name: Hosted Runner Control Smoke

on:
  push:
    paths:
      - '.github/workflows/hosted-runner-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Prove Ubuntu runner
        run: |
          echo "ubuntu-runner-ok"
          uname -a

  windows:
    runs-on: windows-latest
    steps:
      - name: Prove Windows runner
        shell: pwsh
        run: |
          Write-Host "windows-runner-ok"
          [System.Environment]::OSVersion.VersionString
