name: Build Vórtise TV

on:
  push:
    branches: [ vortise-tv-v0.1.2-dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Vórtise customization
        uses: actions/checkout@v4
        with:
          path: branding-repo

      - name: Checkout PipeTV upstream
        uses: actions/checkout@v4
        with:
          repository: LimitedIO/PipeTv
          ref: main
          path: src

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Vórtise TV branding and features
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          cd src
          sed -i 's/applicationId = "dev.limitedio.pipetv"/applicationId = "br.com.luciano.noutubetv"/' app/build.gradle.kts
          sed -i 's/android:label="PipeTv"/android:label="Vórtise"/' app/src/main/AndroidManifest.xml
          rm -f app/src/main/res/drawable-xhdpi/icon.png app/src/main/res/drawable-xhdpi/banner.png
          base64 -d ../branding-repo/branding/vortise_icon.b64 > app/src/main/res/drawable-xhdpi/icon.jpg
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from pathlib import Path

          out = Path('app/src/main/res/drawable-xhdpi/banner.jpg')
          icon = Image.open('app/src/main/res/drawable-xhdpi/icon.jpg').convert('RGB').resize((128, 128), Image.Resampling.LANCZOS)
          banner = Image.new('RGB', (320, 180), (2, 6, 20))
          banner.paste(icon, (10, 26))
          draw = ImageDraw.Draw(banner)
          font_main = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 30)
          font_sub = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 10)
          font_tv = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 13)
          draw.text((148, 48), 'VÓRTISE', font=font_main, fill=(242, 244, 248))
          draw.text((149, 93), 'VIDEO • MUSIC • STREAMING', font=font_sub, fill=(20, 220, 245))
          draw.line((149, 116, 306, 116), fill=(112, 55, 255), width=2)
          draw.text((149, 126), 'ANDROID TV', font=font_tv, fill=(185, 190, 210))
          banner.save(out, quality=92, optimize=True)
          PY
          cd ..

          # Remove two fragile formatting-dependent nav replacements from local patch copies.
          python3 - <<'PY'
          from pathlib import Path
          for name, marker in [
              ('vortise_v012.py', 'root.tab < 5'),
              ('vortise_v012_channels.py', 'root.tab < 6'),
          ]:
              p = Path('branding-repo/patches') / name
              lines = p.read_text(encoding='utf-8').splitlines()
              lines = [line for line in lines if not ('replace(controls' in line and marker in line)]
              p.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

          python3 branding-repo/patches/vortise_v012.py src
          python3 branding-repo/patches/vortise_v012_channels.py src

          # Final navigation has pages 0..7 plus Exit. Change only the comparison token.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/app/src/main/kotlin/dev/limitedio/pipetv/ui/Controls.kt')
          s = p.read_text(encoding='utf-8')
          old = 'root.tab < 5'
          if old not in s:
              raise SystemExit('Controls navigation threshold not found')
          p.write_text(s.replace(old, 'root.tab < 7', 1), encoding='utf-8')
          PY

          chmod +x src/gradlew

      - name: Verify Android SDK
        shell: bash
        run: |
          test -n "${ANDROID_HOME:-}"
          test -d "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          cd src
          ./gradlew testDebugUnitTest -Pnoupdater -Pvname=0.1.2 -Pvcode=3 --stacktrace

      - name: Build installable APK
        shell: bash
        run: |
          set -euo pipefail
          cd src
          ./gradlew assembleDebug -Pnoupdater -Pvname=0.1.2 -Pvcode=3 --stacktrace
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/Vortise-TV-v0.1.2-TESTE.apk
          sha256sum ../out/Vortise-TV-v0.1.2-TESTE.apk | tee ../out/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vortise-TV-v0.1.2-TESTE
          path: |
            out/Vortise-TV-v0.1.2-TESTE.apk
            out/SHA256.txt
          if-no-files-found: error
          retention-days: 30
