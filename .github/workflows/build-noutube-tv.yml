name: Build NouTube TV

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout PipeTV upstream
        uses: actions/checkout@v4
        with:
          repository: LimitedIO/PipeTv
          ref: main
          path: src

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare NouTube TV test build
        shell: bash
        run: |
          set -euo pipefail
          cd src
          sed -i 's/applicationId = "dev.limitedio.pipetv"/applicationId = "br.com.luciano.noutubetv"/' app/build.gradle.kts
          sed -i 's/android:label="PipeTv"/android:label="NouTube TV"/' app/src/main/AndroidManifest.xml
          chmod +x gradlew

      - name: Run tests
        shell: bash
        run: |
          cd src
          ./gradlew test -Pnoupdater --stacktrace

      - name: Build installable APK
        shell: bash
        run: |
          cd src
          ./gradlew assembleDebug -Pnoupdater -Pvname=0.1.0 -Pvcode=1 --stacktrace
          mkdir -p ../out
          cp app/build/outputs/apk/debug/app-debug.apk ../out/NouTube-TV-v0.1.0-TESTE.apk
          sha256sum ../out/NouTube-TV-v0.1.0-TESTE.apk | tee ../out/SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NouTube-TV-v0.1.0-TESTE
          path: |
            out/NouTube-TV-v0.1.0-TESTE.apk
            out/SHA256.txt
          if-no-files-found: error
          retention-days: 30
