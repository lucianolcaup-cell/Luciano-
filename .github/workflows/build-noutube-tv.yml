name: Build NouTube TV APK

on:
  push:
    branches:
      - noutube-tv-v0.1
    paths:
      - '.github/workflows/build-noutube-tv.yml'
      - 'scripts/patch_noutube_tv.py'
      - 'scripts/limit_tv_abis.py'
      - 'README-NOUTUBETV.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout TV build layer
        uses: actions/checkout@v4

      - name: Checkout NouTube upstream 0.7.4
        uses: actions/checkout@v4
        with:
          repository: nonbili/NouTube
          ref: a2eeb7be1f3261a4bc717e009e49300372545d95
          path: upstream

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install NouTube dependencies
        working-directory: upstream
        run: |
          bun link
          bun install --frozen-lockfile

      - name: Apply TV source compatibility layer
        run: python3 scripts/patch_noutube_tv.py upstream --phase source

      - name: Bundle injected NouTube script
        working-directory: upstream
        run: bun bundle:es

      - name: Generate Android project
        working-directory: upstream
        run: bun expo prebuild -p android --clean --no-install

      - name: Apply Android TV manifest and signing layer
        run: python3 scripts/patch_noutube_tv.py upstream --phase android

      - name: Limit build to Android TV ARM architectures
        run: python3 scripts/limit_tv_abis.py

      - name: Build installable release APKs
        working-directory: upstream/android
        run: |
          chmod +x gradlew
          ./gradlew assembleFullRelease --no-daemon --stacktrace

      - name: Collect APKs and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find upstream/android/app/build/outputs/apk/full/release -type f -name '*.apk' -print -exec cp {} dist/ \;
          if ! ls dist/*.apk >/dev/null 2>&1; then
            echo 'Nenhum APK foi gerado.' >&2
            exit 1
          fi
          cd dist
          for f in *.apk; do
            safe=$(echo "$f" | sed 's/^app-/NouTube-TV-v0.1-/; s/-full-release//')
            if [ "$safe" != "$f" ]; then mv "$f" "$safe"; fi
          done
          sha256sum *.apk > SHA256SUMS.txt
          printf '%s\n' \
            'NouTube TV v0.1' \
            'Base: nonbili/NouTube 0.7.4' \
            'Commit: a2eeb7be1f3261a4bc717e009e49300372545d95' \
            'Architectures: arm64-v8a and armeabi-v7a' \
            'Source/patch: branch noutube-tv-v0.1 in lucianolcaup-cell/Luciano-' \
            > SOURCE.txt

      - name: Upload NouTube TV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NouTube-TV-v0.1-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish direct-download APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: noutube-tv-v0.1-build
          target_commitish: noutube-tv-v0.1
          name: NouTube TV v0.1 - Android TV
          prerelease: true
          body: |
            Unofficial Android TV compatibility build based on NouTube 0.7.4.

            Includes Android TV launcher support, D-pad navigation, YouTube + YouTube Music, the upstream NouTube ad-blocking layer and background playback.

            For most modern TVs use arm64-v8a. For 32-bit Android TV use armeabi-v7a.
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/SOURCE.txt
